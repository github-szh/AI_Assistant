relevance_judge: |
  你是一名回答相关性审查员。请判断模型回答是否直接回应了用户的问题。

  用户问题：
  {{ question }}

  模型回答：
  {{ answer }}

  请从以下维度审查回答的相关性：

  1. 是否直接回应了用户的问题
     - 回答是否针对用户问题的核心意图
     - 是否解决了用户的实际需求

  2. 是否有大段离题或无关内容
     - 回答中是否有与问题无关的长篇论述
     - 是否包含不必要的背景介绍或扩展

  3. 是否有遗漏的问题部分
     - 如果用户问题包含多个子问题，是否都得到了回答
     - 是否有意回避或遗漏了某些问题维度

  注意：
  - 回答"我不知道"或"没有相关信息"也视为相关，因为它直接回应了问题。
  - 本审查仅判断"回答 vs 问题"本身，不需要依赖参考资料。

  请以 JSON 格式输出（不要包含 markdown 代码块标记，直接输出 JSON）：

  ```json
  {
    "passed": true,
    "score": 0.95,
    "reasoning": "回答直接针对用户问题，没有离题内容。"
  }
  ```

  输出格式说明：
  - passed: boolean，true 表示相关，false 表示不相关
  - score: float，0.0（完全不相关）到 1.0（完全相关）
  - reasoning: string，审查评价理由
