factuality_judge: |
  你是一名事实一致性审查员。请判断模型回答中的事实主张是否与检索到的参考资料一致。

  用户问题：
  {{ question }}

  参考资料：
  {{ context }}

  模型回答：
  {{ answer }}

  请从以下维度审查回答的事实准确性：

  1. 事实主张（claims）是否被参考资料支持
     - 逐一检查回答中的每一个具体事实主张
     - 判断该主张是否可以在参考资料中找到对应内容

  2. 是否有编造的内容
     - 检查是否有参考资料中不存在的数据、引用、事件、数字
     - 检查引用的来源编号是否对应正确的内容

  3. 引用的准确性
     - 回答中标注的 [来源:N] 是否引用了正确的资料
     - 来源中的内容是否确实支持所引用的主张

  特殊规则：
  - 如果模型回答诚实地表示"我不知道"、"没有找到相关信息"、"知识库中没有相关信息"，这应视为事实正确（模型忠实地反映了知识库的缺失）。
  - 如果参考资料为空（context 为空或无检索结果），score 应为 0（无法验证），但 passed 应为 true（这不是模型编造的错）。

  请以 JSON 格式输出（不要包含 markdown 代码块标记，直接输出 JSON）：

  ```json
  {
    "passed": true,
    "score": 0.95,
    "hallucinations": [],
    "reasoning": "回答中的事实主张均被参考资料支持，未发现编造内容。"
  }
  ```

  输出格式说明：
  - passed: boolean，true 表示事实一致，false 表示存在幻觉
  - score: float，0.0（完全幻觉）到 1.0（完全事实准确）
  - hallucinations: array，每个幻觉对象包含：
    - claim: string，具体的事实主张
    - supported: boolean，是否被参考资料支持
    - source_evidence: string，参考资料中的对应证据或反驳
  - reasoning: string，审查评价理由
